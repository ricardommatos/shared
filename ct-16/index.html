<style>
/* CT-16: one-screen isometric instrument. Line drawing on near-black, a single orange glow. Fills whatever window it is embedded in. */
:root{
  --bg:#141517; --top:#1C1D20; --front:#17181A; --right:#131416; --line:#3A3C41; --line-hi:#55585E;
  --ink:#C9C7C2; --muted:#6E6D69; --deep:#0E0F10; --glow:#FF7A2F; --glow-soft:rgba(255,122,47,.18);
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
:root.paper{--bg:#ECEAE6;--top:#F6F5F2;--front:#E6E4DF;--right:#D9D7D1;--line:#2A2A2A;--line-hi:#111;--ink:#1C1C1C;--muted:#8C8A85;--deep:#D2D0CA;color-scheme:light}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 12px/1.4 var(--mono);overflow:hidden;transition:background .5s;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
svg#dev{width:100%;height:100%;display:block;overflow:visible;touch-action:none;cursor:grab}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot b{color:var(--ink);font-weight:500}

/* drawing */
.ft{fill:var(--top)} .ff{fill:var(--front)} .fr{fill:var(--right)}
polygon,polyline,line,path.ln,rect.ln{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hi polygon{stroke:var(--line-hi)}
.deep{fill:var(--deep)}
.lbl{fill:var(--muted);font-family:var(--mono)}
.lbl-ink{fill:var(--ink);font-family:var(--mono)}
.vent{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.hatch{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.8}
.glow{stroke:var(--glow)!important;filter:url(#glow)}
.glowfill{fill:var(--glow);filter:url(#glow)}
.glowtext{fill:var(--glow);font-family:var(--mono);filter:url(#glow)}
.sel polygon{stroke:var(--glow)!important}
.sel{filter:url(#glow)}
.act polygon{stroke:var(--glow)!important}
.act .ft{fill:var(--glow-soft)}
.led-off{fill:var(--line)}
.led-on{fill:var(--glow);filter:url(#glow)}
.led-head{fill:#FFD7BF;filter:url(#glow)}
.logo-print{fill:var(--line-hi);opacity:.9}
[data-act]{cursor:pointer}
</style>

<script>
(function(){
var scene=document.getElementById("scene"), svg=document.getElementById("dev");
svg.setAttribute("viewBox","-96 -78 192 146");
/* orthographic camera: yaw around the vertical axis, elevation phi. yaw 0 + phi 35.26° = true isometric */
var ISO_PHI=Math.asin(1/Math.sqrt(3)), cam={yaw:0,phi:ISO_PHI}, K=1.2247449, CX=64, CY=36, cy_=1, sy_=0, sp_=0, cp_=0;
function camUpdate(){cy_=Math.cos(cam.yaw);sy_=Math.sin(cam.yaw);sp_=Math.sin(cam.phi);cp_=Math.cos(cam.phi)}
camUpdate();
function rot(x,y){var dx=x-CX,dy=y-CY,a=dx*cy_-dy*sy_,b=dx*sy_+dy*cy_;return [(a-b)/Math.SQRT2,(a+b)/Math.SQRT2]}
function P(x,y,z){var r=rot(x,y);return [r[0]*K,(r[1]*sp_-z*cp_)*K]}
function depth(x,y){return rot(x,y)[1]}
function nview(nx,ny){var a=nx*cy_-ny*sy_,b=nx*sy_+ny*cy_;return [(a-b)/Math.SQRT2,(a+b)/Math.SQRT2]}
function vis(nx,ny){return nview(nx,ny)[1]>0.001}
function f2(n){return n.toFixed(2)}
function pts(a){return a.map(function(p){var q=P(p[0],p[1],p[2]);return f2(q[0])+","+f2(q[1])}).join(" ")}
function poly(a,cls,extra){return '<polygon class="'+(cls||"")+'" points="'+pts(a)+'" '+(extra||"")+'/>'}
function box(x,y,z,w,d,h,cls,extra){
  var sides=[[1,0,[[x+w,y,z+h],[x+w,y+d,z+h],[x+w,y+d,z],[x+w,y,z]]],[-1,0,[[x,y,z+h],[x,y+d,z+h],[x,y+d,z],[x,y,z]]],
             [0,1,[[x,y+d,z+h],[x+w,y+d,z+h],[x+w,y+d,z],[x,y+d,z]]],[0,-1,[[x,y,z+h],[x+w,y,z+h],[x+w,y,z],[x,y,z]]]], g="";
  sides.forEach(function(f){var n=nview(f[0],f[1]);if(n[1]>0.001)g+=poly(f[2],n[0]>0?"fr":"ff")});
  return '<g class="'+(cls||"")+'" '+(extra||"")+'>'+g+poly([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],"ft")+'</g>';
}
/* vertical cylinder: side band, then top ellipse */
function cyl(cx,cy,z,r,h,cls,extra,topCls){
  var b=P(cx,cy,z), X=b[0], Yb=b[1], Yt=Yb-h*cp_*K, rx=K*r, ry=K*r*sp_;
  return '<g class="'+(cls||"")+'" '+(extra||"")+'>'+
    '<path class="ln ff" d="M'+f2(X-rx)+' '+f2(Yt)+'L'+f2(X-rx)+' '+f2(Yb)+'A'+f2(rx)+' '+f2(ry)+' 0 0 0 '+f2(X+rx)+' '+f2(Yb)+'L'+f2(X+rx)+' '+f2(Yt)+'Z" style="stroke:var(--line);vector-effect:non-scaling-stroke"/>'+
    '<ellipse class="ln '+(topCls||"ft")+'" cx="'+f2(X)+'" cy="'+f2(Yt)+'" rx="'+f2(rx)+'" ry="'+f2(ry)+'" style="stroke:var(--line);vector-effect:non-scaling-stroke"/></g>';
}
function ell(cx,cy,z,r,cls,style){var b=P(cx,cy,z);return '<ellipse class="'+cls+'" cx="'+f2(b[0])+'" cy="'+f2(b[1])+'" rx="'+f2(K*r)+'" ry="'+f2(K*r*sp_)+'" style="'+(style||"")+'"/>'}
function basis(dx,dy,dz){var a=P(0,0,0),b=P(dx,dy,dz);return [b[0]-a[0],b[1]-a[1]]}
function mat(u,v,q,k){return "matrix("+(u[0]*k).toFixed(4)+" "+(u[1]*k).toFixed(4)+" "+(v[0]*k).toFixed(4)+" "+(v[1]*k).toFixed(4)+" "+f2(q[0])+" "+f2(q[1])+")"}
function mTop(x,y,z,k){return mat(basis(1,0,0),basis(0,1,0),P(x,y,z),k)}
function mFront(x,y,z,k){return mat(basis(1,0,0),basis(0,0,-1),P(x,y,z),k)}
function mRight(x,y,z,k){return mat(basis(0,-1,0),basis(0,0,-1),P(x,y,z),k)}
function tTop(x,y,z,s,size,anchor,cls){return '<text transform="'+mTop(x,y,z,size/10)+'" font-size="10" text-anchor="'+(anchor||"start")+'" class="'+(cls||"lbl")+'">'+s+'</text>'}
function tFront(x,y,z,s,size,anchor,cls){return '<text transform="'+mFront(x,y,z,size/10)+'" font-size="10" text-anchor="'+(anchor||"start")+'" class="'+(cls||"lbl")+'">'+s+'</text>'}
function tRight(x,y,z,s,size,anchor,cls){return '<text transform="'+mRight(x,y,z,size/10)+'" font-size="10" text-anchor="'+(anchor||"start")+'" class="'+(cls||"lbl")+'">'+s+'</text>'}
function line(a,b,cls){var p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);return '<line class="'+(cls||"vent")+'" x1="'+f2(p[0])+'" y1="'+f2(p[1])+'" x2="'+f2(q[0])+'" y2="'+f2(q[1])+'"/>'}

/* ---------- object: a thin slab ---------- */
var W=128, D=72, H=5, Z=H;
var KEYS0={x:8,y:31,w:12,d:7.6,g:1.3,h:1.3};
var NAMES=["kick","snare","c.hat","o.hat","clap","rim","tom lo","tom mid","tom hi","cowbell","clave","conga","shaker","zap","sub","crash"];
var KEYS="1234qwerasdfzxcv";
var ENC=[{x:74,lbl:"TEMPO"},{x:89,lbl:"FILTER"},{x:104,lbl:"SPACE"},{x:119,lbl:"PITCH"}], ENCY=15, ENCR=5;
var FX=[["EXPLODE","explode"],["GRAVITY","gravity"],["GLITCH","glitch"],["WARP","warp"],["INVERT","invert"],["LOGO","logo"]];
var SCR={x:30,y:6,w:32,d:19}, RIB={x:70,y:53,w:54,d:4.5}, STEPS={x:70,y:62,w:2.8,g:.6};

/* ---------- state ---------- */
var st={bpm:112,playing:false,step:-1,sel:0,flash:new Array(16).fill(0),pz:new Array(16).fill(0),pv:new Array(16).fill(0),
  explode:0,glitch:0,warp:0,logo:0,enc:[.433,.82,.25,.5],rib:-1,fxOn:{},msg:"CT-16 READY",msgT:performance.now(),dirty:true,scope:null};
var pat=NAMES.map(function(){return new Array(16).fill(false)});
[[0,[0,3,8,10]],[1,[4,12]],[2,[0,2,4,6,8,10,12,14]],[3,[14]],[4,[12]],[5,[7]],[14,[0,11]],[13,[15]]].forEach(function(r){r[1].forEach(function(s){pat[r[0]][s]=true})});

function render(){
  var e=ease(st.explode), o=[], i;
  var off={keys:13*e,enc:22*e,btn:17*e,steps:9*e,scr:7*e,rib:5*e,spk:4*e};
  /* slab */
  o.push(box(0,0,0,W,D,H,"hi"));
  [[3.2,3.2],[W-3.2,3.2],[3.2,D-3.2],[W-3.2,D-3.2]].forEach(function(p){o.push(ell(p[0],p[1],Z,1,"ln deep","stroke:var(--line);vector-effect:non-scaling-stroke"));o.push(line([p[0]-.6,p[1]+.6,Z],[p[0]+.6,p[1]-.6,Z]))});
  /* side details */
  if(vis(1,0))o.push('<g>'+[18,26].map(function(yy){var b=P(W,yy,2.5);return '<circle class="deep" r="1.2" transform="'+mRight(W,yy,2.5,1)+'" style="stroke:var(--line);vector-effect:non-scaling-stroke"/>'}).join("")+'</g>');
  if(vis(1,0))o.push(poly([[W,34,3.2],[W,38,3.2],[W,38,1.8],[W,34,1.8]],"deep"));
  if(vis(0,1))o.push('<use href="#ctlogo" class="logo-print" transform="'+mFront(6,D,4.1,3.2/874)+'"/>');
  /* speaker: dot field in a circle */
  var sx=14, sy=15, sr=9.5, sz=Z+off.spk;
  o.push(ell(sx,sy,sz,sr+.8,"ln","fill:none;stroke:var(--line);vector-effect:non-scaling-stroke"));
  for(var gx=-sr;gx<=sr;gx+=1.9)for(var gy=-sr;gy<=sr;gy+=1.9)if(gx*gx+gy*gy<sr*sr*.92)o.push('<circle class="deep" r=".42" transform="'+mTop(sx+gx,sy+gy,sz,1)+'"/>');
  /* screen */
  var z2=Z+off.scr, s=SCR;
  o.push(poly([[s.x-1.2,s.y-1.2,z2],[s.x+s.w+1.2,s.y-1.2,z2],[s.x+s.w+1.2,s.y+s.d+1.2,z2],[s.x-1.2,s.y+s.d+1.2,z2]],"ft"));
  o.push(poly([[s.x,s.y,z2],[s.x+s.w,s.y,z2],[s.x+s.w,s.y+s.d,z2],[s.x,s.y+s.d,z2]],"deep glow",'style="stroke-width:1.1"'));
  var m=screenText();
  o.push(tTop(s.x+1.6,s.y+4.4,z2,m[0],3.2,"start","glowtext"));
  o.push(tTop(s.x+1.6,s.y+7.6,z2,m[1],1.75,"start","glowtext"));
  for(i=0;i<16;i++){var bx=s.x+1.6+i*1.8,on=pat[st.sel][i],hd=st.playing&&st.step===i;
    o.push(poly([[bx,s.y+16.4,z2],[bx+1.3,s.y+16.4,z2],[bx+1.3,s.y+17.6,z2],[bx,s.y+17.6,z2]],"",'style="fill:'+(hd?"#FFD7BF":on?"var(--glow)":"none")+';stroke:var(--glow);'+(hd||on?"filter:url(#glow)":"opacity:.5")+'"'))}
  var sc=st.scope, pl=[];
  for(i=0;i<48;i++){var v=sc?sc[i]:Math.sin(i/3+performance.now()/400)*.08;pl.push([s.x+1.6+i*(s.w-3.2)/47,s.y+12.2-Math.max(-3,Math.min(3,v*9)),z2])}
  o.push('<polyline points="'+pts(pl)+'" style="fill:none;stroke:var(--glow);stroke-width:1.1;vector-effect:non-scaling-stroke;filter:url(#glow)"/>');
  /* ribbon */
  var rz=Z+off.rib;
  o.push(poly([[RIB.x,RIB.y,rz],[RIB.x+RIB.w,RIB.y,rz],[RIB.x+RIB.w,RIB.y+RIB.d,rz],[RIB.x,RIB.y+RIB.d,rz]],"deep",'data-act="rib"'));
  for(i=1;i<4;i++)o.push(line([RIB.x+i*RIB.w/4,RIB.y+.6,rz],[RIB.x+i*RIB.w/4,RIB.y+RIB.d-.6,rz],"hatch"));
  ["1/4","1/8","1/16","1/32"].forEach(function(t,k){o.push(tTop(RIB.x+k*RIB.w/4+1,RIB.y-.7,rz,t,1.5,"start"))});
  o.push(tTop(RIB.x+RIB.w,RIB.y-.7,rz,"REPEAT",1.5,"end"));
  if(st.rib>=0){var rx=RIB.x+st.rib*RIB.w;o.push(line([rx,RIB.y,rz],[rx,RIB.y+RIB.d,rz],"vent glow"));o.push(poly([[RIB.x,RIB.y,rz],[rx,RIB.y,rz],[rx,RIB.y+RIB.d,rz],[RIB.x,RIB.y+RIB.d,rz]],"",'style="fill:var(--glow);opacity:.12;stroke:none"'))}
  /* labels printed on the slab */
  o.push(tTop(8,29.4,Z,"PADS",1.5,"start"));
  o.push(tTop(70,59.2,Z,"STEPS · "+NAMES[st.sel].toUpperCase(),1.5,"start"));
  /* raised parts, back to front */
  var items=[];
  ENC.forEach(function(en,k){items.push({k:depth(en.x,ENCY),f:function(){
    var z=Z+off.enc, h=4.2, a=-Math.PI*.75+st.enc[k]*Math.PI*1.5, hot=k===0;
    var g=cyl(en.x,ENCY,z,ENCR,h,"",'data-act="enc" data-i="'+k+'"',hot?"ft glowring":"ft");
    g+=ell(en.x,ENCY,z+h,ENCR*.62,"","fill:none;stroke:var(--line);vector-effect:non-scaling-stroke;pointer-events:none");
    var p0=[en.x+Math.cos(a)*ENCR*.25,ENCY+Math.sin(a)*ENCR*.25,z+h],p1=[en.x+Math.cos(a)*ENCR*.86,ENCY+Math.sin(a)*ENCR*.86,z+h];
    g+=line(p0,p1,hot?"vent glow":"vent");
    if(hot)g=g.replace('class="ln ft glowring"','class="ln ft" style="stroke:var(--glow);vector-effect:non-scaling-stroke;filter:url(#glow)"');
    g+=tTop(en.x-ENCR,ENCY+ENCR+2.6,Z,en.lbl,1.5,"start");
    return g}})});
  FX.forEach(function(f,k){var c=k%3,r=Math.floor(k/3),x=76+c*14,y=31+r*10.5;items.push({k:depth(x,y),f:function(){
    var on=st.fxOn[f[1]], z=Z+off.btn+(on?-.5:0);
    var g=cyl(x,y,z,3.1,1.4,on?"act":"",'data-act="fx" data-fx="'+f[1]+'"',on?"ft":"ft");
    if(on)g+=ell(x,y,z+1.4,3.1,"","fill:var(--glow);opacity:.25;stroke:var(--glow);vector-effect:non-scaling-stroke;filter:url(#glow);pointer-events:none");
    g+=ell(x,y,z+1.4,.7,"",on?"fill:var(--glow);filter:url(#glow)":"fill:var(--line)");
    g+=tTop(x-3.4,y+5.6,Z,f[0],1.45,"start",on?"glowtext":"lbl");
    return g}})});
  items.push({k:depth(120,41),f:function(){var z=Z+off.btn+(st.playing?-.5:0),g=cyl(120,41,z,5,1.8,st.playing?"act":"",'data-act="play"');
    g+='<g transform="'+mTop(118.2,41,z+1.8,1)+'" style="pointer-events:none"><polygon points="0,-2.2 3.6,0 0,2.2" style="fill:'+(st.playing?"var(--glow)":"var(--muted)")+';stroke:none;'+(st.playing?"filter:url(#glow)":"")+'"/></g>';
    g+=tTop(115,48.2,Z,"PLAY",1.45,"start",st.playing?"glowtext":"lbl");return g}});
  for(var r=0;r<4;r++)for(var c=0;c<4;c++)(function(r,c){var n=r*4+c,x=KEYS0.x+c*(KEYS0.w+KEYS0.g),y=KEYS0.y+r*(KEYS0.d+KEYS0.g);items.push({k:depth(x+KEYS0.w/2,y+KEYS0.d/2),f:function(){
    var z=Z+off.keys*(1+r*.3)+st.pz[n], sel=n===st.sel, g=box(x,y,z,KEYS0.w,KEYS0.d,KEYS0.h,sel?"sel":"",'data-act="pad" data-n="'+n+'"');
    if(st.flash[n]>.02)g+=poly([[x,y,z+KEYS0.h],[x+KEYS0.w,y,z+KEYS0.h],[x+KEYS0.w,y+KEYS0.d,z+KEYS0.h],[x,y+KEYS0.d,z+KEYS0.h]],"",'style="fill:var(--glow);opacity:'+(st.flash[n]*.55).toFixed(2)+';stroke:var(--glow);filter:url(#glow);pointer-events:none"');
    g+=tTop(x+1,y+KEYS0.d-1.3,z+KEYS0.h,NAMES[n],1.6,"start",sel?"glowtext":"lbl");
    g+=tTop(x+KEYS0.w-1,y+2.4,z+KEYS0.h,KEYS[n],1.6,"end",sel?"glowtext":"lbl");
    return g}})})(r,c);
  for(i=0;i<16;i++)(function(i){var x=STEPS.x+i*(STEPS.w+STEPS.g);items.push({k:depth(x+1.4,STEPS.y+2),f:function(){
    var z=Z+off.steps,on=pat[st.sel][i],hd=st.playing&&st.step===i;
    var g=box(x,STEPS.y,z,STEPS.w,4,.9,"",'data-act="step" data-s="'+i+'"');
    g+='<circle class="'+(hd?"led-head":on?"led-on":"led-off")+'" r=".45" transform="'+mTop(x+1.4,STEPS.y+6.2,Z,1)+'" style="pointer-events:none"/>';
    if(i%4===0)g+=tTop(x,STEPS.y+8.6,Z,String(i+1),1.4,"start");
    return g}})})(i);
  items.sort(function(a,b){return a.k-b.k}).forEach(function(it){o.push(it.f())});
  /* logo hologram: beam, code-built mark, outline, dissolve */
  if(st.logoT0){var lt=(performance.now()-st.logoT0)/1000; if(lt>5.2){st.logoT0=0}else o.push(holo(lt,s))}
  scene.innerHTML=o.join("");
}

/* ---------- logo hologram ---------- */
var LG={N:34,cells:[],ready:false};
(function(){
  try{
    var N=LG.N,R=N*4,cv=document.createElement("canvas");cv.width=cv.height=R;var c=cv.getContext("2d");
    c.scale(R/874,R/874);c.fillStyle="#fff";c.fill(new Path2D(document.getElementById("ctlogo").getAttribute("d")),"evenodd");
    var px=c.getImageData(0,0,R,R).data,WORD="CODEANDTHEORY",k=0;
    for(var r=0;r<N;r++)for(var q=0;q<N;q++){var a=0;for(var yy=0;yy<4;yy++)for(var xx=0;xx<4;xx++)a+=px[((r*4+yy)*R+(q*4+xx))*4+3];
      if(a/16>90)LG.cells.push({r:r,c:q,ch:WORD[k++%WORD.length],rnd:Math.random(),vy:.6+Math.random()*1.6})}
    var p=document.getElementById("ctlogo").cloneNode();p.id="ctlogoLine";p.setAttribute("pathLength","1");document.querySelector("#dev defs").appendChild(p);
    LG.ready=true;
  }catch(e){}
})();
var GLYPHS="01{}<>/;=+*#&$%";
function holo(t,s){
  var SZ=38,x0=s.x+s.w/2-SZ/2,y0=s.y+s.d/2,base=Z+ease(st.explode)*7+2.5,top=base+3+SZ,k=SZ/874,cell=874/LG.N,out="";
  var rise=Math.min(1,t/.45), fade=t>4.4?Math.max(0,1-(t-4.4)/.8):1;
  var bh=(top+2-base)*ease(rise)*fade;
  out+=poly([[x0-1,y0,base],[x0+SZ+1,y0,base],[x0+SZ+1,y0,base+bh],[x0-1,y0,base+bh]],"",'style="fill:var(--glow);opacity:'+(0.07*fade).toFixed(3)+';stroke:var(--glow);stroke-opacity:'+(0.35*fade).toFixed(2)+';vector-effect:non-scaling-stroke"');
  var scan=Math.min(1,Math.max(0,(t-.35)/1.4));
  if(scan>0&&scan<1){var sz=base+3+SZ*scan;out+=line([x0-3,y0,sz],[x0+SZ+3,y0,sz],"vent glow")}
  if(!LG.ready)return '<g style="pointer-events:none">'+out+'</g>';
  var draw=Math.min(1,Math.max(0,(t-1.1)/1.2));
  [[-1.4,.35],[1.4,.9]].forEach(function(pl){
    if(draw<=0)return;
    out+='<use href="#ctlogoLine" transform="'+mFront(x0,y0+pl[0],top,k)+'" style="fill:none;stroke:var(--glow);stroke-width:'+(pl[1]>.5?1.3:.9)+';vector-effect:non-scaling-stroke;stroke-dasharray:'+draw.toFixed(3)+' 1;opacity:'+(pl[1]*fade).toFixed(2)+'"/>';
  });
  if(t>2.2)out+='<use href="#ctlogo" transform="'+mFront(x0,y0+1.4,top,k)+'" style="fill:var(--glow);opacity:'+(Math.min(.14,(t-2.2)*.3)*fade).toFixed(3)+'"/>';
  var txt="",rowT,ch,op,dy,wave;
  for(var i=0;i<LG.cells.length;i++){var cl=LG.cells[i];
    rowT=.35+1.4*(1-cl.r/LG.N);
    if(t<rowT)continue;
    var settle=rowT+.35+cl.rnd*.5;
    ch=t<settle?GLYPHS[(Math.floor(t*30)+i*7)%GLYPHS.length]:cl.ch;
    wave=t>2.4&&t<4.4?Math.max(0,1-Math.abs(((t-2.4)*1.6%1.4)-(1-cl.r/LG.N)*1.2)*4):0;
    op=Math.min(1,(t-rowT)*6)*(t<settle?.55:.85)+wave*.15;
    dy=t>4.2?-(t-4.2)*(t-4.2)*cl.vy*260:0;
    if(t>4.2)op*=Math.max(0,1-(t-4.2)/(.6+cl.rnd*.6));
    if(op<=.02)continue;
    txt+='<text x="'+(cl.c*cell+cell/2).toFixed(0)+'" y="'+(cl.r*cell+cell*.8+dy).toFixed(0)+'" style="opacity:'+op.toFixed(2)+(wave>.3?';fill:#FFE2CF':'')+'">'+ch+'</text>';
  }
  out+='<g transform="'+mFront(x0,y0,top,k)+'" font-size="'+(cell*.95).toFixed(0)+'" text-anchor="middle" font-weight="700" class="glowtext">'+txt+'</g>';
  return '<g style="pointer-events:none">'+out+'</g>';
}
function screenText(){
  var now=performance.now(),n=pat[st.sel].filter(Boolean).length;
  return [st.bpm+" BPM "+(st.playing?"▶":"■"),(st.msg&&now-st.msgT<1800)?st.msg:NAMES[st.sel].toUpperCase()+" · "+n+" STEPS"];
}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function say(m){st.msg=m;st.msgT=performance.now();st.dirty=true}

/* ---------- audio ---------- */
var AC,master,crush,lp,dly,fb,wet,nb,ana,anaBuf,pitchMul=1;
function pm(){return pitchMul*Math.pow(2,Math.round((st.enc[3]-.5)*24)/12)}
function audio(){
  if(AC)return AC;var K=window.AudioContext||window.webkitAudioContext;if(!K)return null;
  AC=new K();master=AC.createGain();master.gain.value=.8;crush=AC.createWaveShaper();crush.curve=curve(0);
  lp=AC.createBiquadFilter();lp.type="lowpass";lp.Q.value=4;dly=AC.createDelay(1);fb=AC.createGain();wet=AC.createGain();
  ana=AC.createAnalyser();ana.fftSize=256;anaBuf=new Float32Array(256);
  master.connect(crush);crush.connect(lp);lp.connect(ana);ana.connect(AC.destination);lp.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(AC.destination);
  nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  applyEnc();return AC;
}
function curve(bits){var n=1024,c=new Float32Array(n);for(var i=0;i<n;i++){var x=i/(n-1)*2-1;c[i]=bits?Math.round(x*bits)/bits:x}return c}
function env(g,t,a,p,dc){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dc)}
function nz(t,dur,type,f,q,p,a){var s=AC.createBufferSource();s.buffer=nb;var b=AC.createBiquadFilter();b.type=type;b.frequency.value=f*pm();if(q)b.Q.value=q;var g=AC.createGain();env(g,t,a||.002,p,dur);s.connect(b);b.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05)}
function ton(t,type,f0,f1,dur,p,sw){var k=pm(),o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0*k,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1*k,t+(sw||dur));var g=AC.createGain();env(g,t,.003,p,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function voice(n,t){
  if(!AC)return;
  switch(n){
    case 0:ton(t,"sine",160,44,.45,1,.13);ton(t,"square",1200,0,.01,.1);break;
    case 1:nz(t,.19,"highpass",1500,0,.55);ton(t,"triangle",185,140,.11,.35);break;
    case 2:nz(t,.045,"highpass",8000,0,.3);break;
    case 3:nz(t,.32,"highpass",7000,0,.25);break;
    case 4:[0,.011,.022].forEach(function(o){nz(t+o,.1+o,"bandpass",1400,1.3,.6)});break;
    case 5:ton(t,"triangle",900,0,.04,.35);nz(t,.02,"bandpass",3000,2,.2);break;
    case 6:ton(t,"sine",110,78,.32,.75);break;
    case 7:ton(t,"sine",150,105,.28,.7);break;
    case 8:ton(t,"sine",205,145,.25,.65);break;
    case 9:ton(t,"square",540,0,.22,.12);ton(t,"square",800,0,.22,.1);break;
    case 10:ton(t,"sine",2500,0,.05,.4);break;
    case 11:ton(t,"sine",330,280,.2,.55,.05);break;
    case 12:nz(t,.09,"bandpass",6000,1,.35,.025);break;
    case 13:ton(t,"sawtooth",1800,55,.18,.3);break;
    case 14:ton(t,"sine",58,42,.9,.9,.3);break;
    case 15:nz(t,1.3,"highpass",3200,0,.32);nz(t,.6,"bandpass",5200,1,.2);break;
  }
}
function applyEnc(){
  st.bpm=Math.round(60+st.enc[0]*120);
  if(!AC)return;var t=AC.currentTime;
  lp.frequency.setTargetAtTime(180*Math.pow(100,st.enc[1]),t,.03);
  var sp=st.enc[2];dly.delayTime.setTargetAtTime(.09+.28*sp,t,.05);fb.gain.setTargetAtTime(.55*sp,t,.05);wet.gain.setTargetAtTime(.6*sp,t,.05);
}
function encMsg(k){var v=st.enc[k];return k===0?st.bpm+" BPM":k===1?"FILTER "+Math.round(v*100)+"%":k===2?"SPACE "+Math.round(v*100)+"%":"PITCH "+(Math.round((v-.5)*24)>0?"+":"")+Math.round((v-.5)*24)}

/* ---------- sequencer ---------- */
var nextT=0,nStep=0,queue=[],timer=null;
function sd(){return 60/st.bpm/4}
function sched(){while(nextT<AC.currentTime+.12){var t=nextT;for(var n=0;n<16;n++)if(pat[n][nStep]){voice(n,t);queue.push({t:t,n:n})}queue.push({t:t,step:nStep});nextT+=sd();nStep=(nStep+1)%16}}
function play(){if(!audio())return;AC.resume();if(st.playing){st.playing=false;clearInterval(timer);queue=[];st.step=-1;st.dirty=true;return}st.playing=true;nStep=0;nextT=AC.currentTime+.05;timer=setInterval(sched,25);sched();st.dirty=true}
function hit(n,keepSel){if(audio()){AC.resume();voice(n,AC.currentTime)}st.flash[n]=1;if(!keepSel)st.sel=n;st.dirty=true}

/* ---------- ribbon: note repeat ---------- */
var ribTimer=null;
function ribbon(v){
  st.rib=v; var div=[1,2,4,8][Math.min(3,Math.floor(v*4))], ms=60000/st.bpm/div;
  clearInterval(ribTimer); hit(st.sel,true); ribTimer=setInterval(function(){hit(st.sel,true)},ms); st.dirty=true;
}
function ribOff(){clearInterval(ribTimer);ribTimer=null;st.rib=-1;st.dirty=true}

/* ---------- the strange keys ---------- */
var anims={};
function anim(key,to,ms){anims[key]={from:st[key],to:to,t0:performance.now(),ms:ms}}
function fx(id){
  audio();if(AC)AC.resume();var on=!st.fxOn[id];
  if(id==="explode"){st.fxOn.explode=on;say(on?"EXPLODED VIEW":"ASSEMBLED");anim("explode",on?1:0,900)}
  if(id==="gravity"){st.fxOn.gravity=true;say("GRAVITY OFF");for(var i=0;i<16;i++){st.pv[i]=14+Math.random()*22;st.pz[i]=Math.max(st.pz[i],.01)}setTimeout(function(){st.fxOn.gravity=false;st.dirty=true},2600)}
  if(id==="glitch"){st.fxOn.glitch=true;st.glitch=1;say("SIGNAL LOST");if(crush)crush.curve=curve(5);
    var k=0,iv=setInterval(function(){hit(Math.floor(Math.random()*16),true);if(++k>10)clearInterval(iv)},70);
    setTimeout(function(){st.fxOn.glitch=false;if(crush)crush.curve=curve(0);st.dirty=true},1500)}
  if(id==="warp"){st.fxOn.warp=true;say("TAPE STOP");var e0=st.enc[0],t0=performance.now();
    var iv2=setInterval(function(){var k2=(performance.now()-t0)/1600,dn=k2<.5?1-k2*1.5:.25+(k2-.5)*1.5;dn=Math.min(1,Math.max(.25,dn));pitchMul=dn;st.bpm=Math.round((60+e0*120)*dn);st.warp=Math.sin(Math.min(1,k2)*Math.PI);st.dirty=true;if(k2>=1){clearInterval(iv2);pitchMul=1;applyEnc();st.warp=0;st.fxOn.warp=false}},30)}
  if(id==="invert"){var p=document.documentElement.classList.toggle("paper");st.fxOn.invert=p;say(p?"PAPER MODE":"NIGHT MODE")}
  if(id==="logo"){st.fxOn.logo=true;st.logoT0=performance.now();say("CODE AND THEORY");
    if(AC){var t=AC.currentTime;[0,7,12,16,19,24,19,16].forEach(function(n,i){ton(t+.35+i*.15,"triangle",261.6*Math.pow(2,n/12),0,.4,.2)});
      for(var q=0;q<14;q++)ton(t+.35+q*.1,"square",1800+q*120,0,.012,.05);
      [0,4,7].forEach(function(n){ton(t+2.3,"sine",130.8*Math.pow(2,n/12),0,2,.12)});ton(t+4.2,"sawtooth",900,4000,.7,.06)}
    var wave=0,iv3=setInterval(function(){for(var r=0;r<4;r++)for(var c=0;c<4;c++)if(r+c===wave)st.flash[r*4+c]=1;st.dirty=true;if(++wave>7)clearInterval(iv3)},90);
    setTimeout(function(){st.fxOn.logo=false;st.dirty=true},5200)}
  st.dirty=true;
}

/* ---------- input ---------- */
var drag=null;
function toPlane(e,z){var pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var q=pt.matrixTransform(scene.getScreenCTM().inverse());
  var u=q.x/K,v=(q.y/K+z*cp_)/sp_,a=(u+v)/Math.SQRT2,b=(v-u)/Math.SQRT2;return [a*cy_+b*sy_+CX,-a*sy_+b*cy_+CY]}
function ribX(e){var p=toPlane(e,Z+ease(st.explode)*5);return Math.min(.999,Math.max(0,(p[0]-RIB.x)/RIB.w))}
svg.addEventListener("pointerdown",function(e){
  var g=e.target.closest("[data-act]");
  if(!g){drag={kind:"orbit",x:e.clientX,y:e.clientY,yaw:cam.yaw,phi:cam.phi};svg.setPointerCapture(e.pointerId);svg.style.cursor="grabbing";return}
  var a=g.getAttribute("data-act");
  if(a==="pad")hit(+g.getAttribute("data-n"));
  else if(a==="step"){var s=+g.getAttribute("data-s");pat[st.sel][s]=!pat[st.sel][s];st.dirty=true}
  else if(a==="play")play();
  else if(a==="fx")fx(g.getAttribute("data-fx"));
  else if(a==="enc"){audio();drag={kind:"enc",i:+g.getAttribute("data-i"),y:e.clientY,v:st.enc[+g.getAttribute("data-i")],moved:false};svg.setPointerCapture(e.pointerId)}
  else if(a==="rib"){drag={kind:"rib"};svg.setPointerCapture(e.pointerId);ribbon(ribX(e))}
});
svg.addEventListener("pointermove",function(e){
  if(!drag)return;
  if(drag.kind==="orbit"){camTween=null;cam.yaw=drag.yaw+(e.clientX-drag.x)*.008;cam.phi=Math.min(1.45,Math.max(.12,drag.phi+(e.clientY-drag.y)*.005));camUpdate();st.dirty=true;return}
  if(drag.kind==="enc"){var dy=drag.y-e.clientY;if(Math.abs(dy)>3)drag.moved=true;st.enc[drag.i]=Math.min(1,Math.max(0,drag.v+dy/180));applyEnc();say(encMsg(drag.i))}
  if(drag.kind==="rib"){var v=ribX(e);if(Math.floor(v*4)!==Math.floor(st.rib*4))ribbon(v);else{st.rib=v;st.dirty=true}}
});
svg.addEventListener("pointerup",function(){
  if(drag&&drag.kind==="enc"&&!drag.moved){st.enc[drag.i]=(Math.round(st.enc[drag.i]*8)+1)%9/8;applyEnc();say(encMsg(drag.i))}
  if(drag&&drag.kind==="rib")ribOff();
  drag=null;svg.style.cursor="";
});
var camTween=null;
svg.addEventListener("dblclick",function(e){if(e.target.closest("[data-act]"))return;camTween={y0:cam.yaw,p0:cam.phi,y1:Math.round(cam.yaw/(Math.PI*2))*Math.PI*2,p1:ISO_PHI,t0:performance.now()}});
window.addEventListener("keydown",function(e){if(e.repeat)return;var i=KEYS.indexOf(e.key.toLowerCase());if(i>=0){hit(i);return}if(e.code==="Space"){e.preventDefault();play()}});

/* ---------- loop ---------- */
var gd=document.getElementById("gd"),gt=document.getElementById("gt"),root=document.getElementById("root"),last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;var busy=false;
  for(var k in anims){var a=anims[k],p=Math.min(1,(now-a.t0)/a.ms);st[k]=a.from+(a.to-a.from)*p;busy=true;if(p>=1)delete anims[k]}
  if(AC){while(queue.length&&queue[0].t<=AC.currentTime){var q=queue.shift();if(q.step!==undefined)st.step=q.step;else st.flash[q.n]=1;busy=true}
    ana.getFloatTimeDomainData(anaBuf);var sc=[];for(var j=0;j<48;j++)sc.push(anaBuf[j*5]);st.scope=sc;}
  for(var i=0;i<16;i++){
    if(st.flash[i]>0){st.flash[i]=Math.max(0,st.flash[i]-dt*3.2);busy=true}
    if(st.pz[i]>0||st.pv[i]>0){st.pv[i]-=70*dt;st.pz[i]+=st.pv[i]*dt;if(st.pz[i]<=0){st.pz[i]=0;if(st.pv[i]<-8){hit(i,true);st.pv[i]=-st.pv[i]*.45}else st.pv[i]=0}busy=true}
  }
  if(camTween){var ct=Math.min(1,(now-camTween.t0)/700),ce=ease(ct);cam.yaw=camTween.y0+(camTween.y1-camTween.y0)*ce;cam.phi=camTween.p0+(camTween.p1-camTween.p0)*ce;camUpdate();busy=true;if(ct>=1)camTween=null}
  if(st.logoT0||st.playing||st.rib>=0||(st.msg&&now-st.msgT<1900)||!AC)busy=true;
  if(busy||st.dirty){render();st.dirty=false}
  requestAnimationFrame(frame);
}
applyEnc();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){st.dirty=true});
requestAnimationFrame(frame);
})();
