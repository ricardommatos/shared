<title>C&amp;T Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one calm canvas in the space's own colour. Home = a grid of fanned photo stacks; inside a stack = a loose grid of tilted, rounded prints. */
:root{
  /* Space colours are recomputed in script from the chosen background so UI text always passes WCAG AA. These are the defaults. */
  --bg:#FFFFFF; --ink:#141518; --muted:#5E626B; --surface:rgba(20,21,24,.06); --surface-2:rgba(20,21,24,.10); --line:rgba(20,21,24,.16);
  --accent:#2F5BFF; --accent-ink:#FFFFFF; --heart:#FF3B5C; --paper:#FFFFFF;
  --shadow:0 1px 2px rgba(10,12,20,.08),0 12px 28px rgba(10,12,20,.14);
  --lb-bg:rgba(10,11,13,.96); --lb-ink:#F1F2F4; --lb-muted:#A2A6AE; --lb-line:rgba(255,255,255,.12);
  --f-disp:"Bricolage Grotesque","Geist",system-ui,sans-serif;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-photo:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131416;--ink:#F2F3F5;--muted:#A6AAB2;--surface:rgba(242,243,245,.07);--surface-2:rgba(242,243,245,.12);--line:rgba(242,243,245,.18);--accent:#5C7CFF;--paper:#1C1D20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131416;--ink:#F2F3F5;--muted:#A6AAB2;--surface:rgba(242,243,245,.07);--surface-2:rgba(242,243,245,.12);--line:rgba(242,243,245,.18);--accent:#5C7CFF;--paper:#1C1D20;color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;overflow:hidden;transition:background-color .25s,color .25s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.app{height:100%;display:flex;flex-direction:column;position:relative}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.01em;justify-self:start;white-space:nowrap}
.mark i{font-style:normal;display:inline-grid;place-items:center;height:26px;padding:0 8px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;letter-spacing:.01em}
.space{justify-self:center;font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;max-width:44vw;padding:6px 12px;border-radius:999px}
.space span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.space:hover{background:var(--surface)}
.bar-r{justify-self:end;display:flex;gap:6px}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.round:hover{background:var(--surface-2)}

.scroller{flex:1;overflow:auto;min-height:0;padding-block:8px 140px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:18px 0 26px}
.head h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(34px,5.4vw,60px);line-height:.98;letter-spacing:-.03em;margin:0;text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.head .sub{color:var(--muted);margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin-bottom:10px;padding:4px 8px 4px 2px;border-radius:8px}
.back:hover{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.status{color:var(--muted);margin:-10px 0 18px}
.status:empty{display:none}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--muted);min-width:0}
.search input{border:0;background:transparent;outline:0;color:var(--ink);width:160px;min-width:0}
.search input::placeholder{color:var(--muted)}

/* Drag-to-pin zone (appears while a stack is being dragged) */
.pinzone{display:flex;justify-content:center;margin:-6px 0 26px}
.pinzone div{display:inline-flex;align-items:center;gap:8px;padding:16px 30px;border-radius:999px;border:1.5px dashed var(--line);color:var(--ink);font-weight:500;background:var(--bg);transition:all .15s}
.pinzone.drop-on div{border-color:var(--accent);color:var(--accent);background:var(--surface);transform:scale(1.04)}

/* Stacks */
.stacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px}
.stacks.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px;margin-bottom:36px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.stack.lifted{opacity:.35}
.pile{position:relative;aspect-ratio:1/1;width:100%;display:block;border-radius:28px}
.ph{position:absolute;left:50%;top:50%;width:60%;aspect-ratio:4/5;border-radius:var(--r-photo);overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.8,.2,1);border:3px solid var(--paper)}
.small .ph{border-width:2px;border-radius:16px}
.ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph.p3{transform:translate(-50%,-50%) translate(-17%,4%) rotate(-11deg)}
.ph.p2{transform:translate(-50%,-50%) translate(17%,2%) rotate(9deg)}
.ph.p1{transform:translate(-50%,-50%) rotate(-2deg)}
.pile:hover .p3,.pile:focus-visible .p3,.stack.drop-on .p3{transform:translate(-50%,-50%) translate(-30%,6%) rotate(-16deg)}
.pile:hover .p2,.pile:focus-visible .p2,.stack.drop-on .p2{transform:translate(-50%,-50%) translate(30%,4%) rotate(14deg)}
.pile:hover .p1,.pile:focus-visible .p1,.stack.drop-on .p1{transform:translate(-50%,-52%) rotate(0deg) scale(1.03)}
.ph.blank{background:var(--surface);box-shadow:none;border:2px dashed var(--line)}
.pile .hint{position:absolute;inset:auto 0 5%;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.stack.drop-on .pile{background:var(--surface)}
.stack.drop-on .pile::after{content:attr(data-drop-label);position:absolute;left:50%;bottom:2%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow);max-width:96%;overflow:hidden;text-overflow:ellipsis}
.label{display:flex;align-items:flex-start;gap:8px;padding:0 6px}
.label div{min-width:0;flex:1}
.label b{display:block;font-weight:600;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small .label b{font-size:14px}
.label span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.label span svg{width:13px;height:13px}
.more{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover{background:var(--surface);color:var(--ink)}
.pile.new{border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);transition:border-color .2s,color .2s,background .2s}
.pile.new:hover{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.pile.new span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.pile.new svg{width:26px;height:26px}

/* Photo grid inside a stack */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 22px;padding:6px}
.tile{position:relative;aspect-ratio:4/5;border-radius:var(--r-photo);background:var(--surface-2);box-shadow:var(--shadow);transform:rotate(var(--rot,0deg));transition:transform .3s cubic-bezier(.2,.8,.2,1);cursor:zoom-in;max-width:100%;margin:0}
.tile .img{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile:hover{transform:rotate(0deg) translateY(-4px) scale(1.02);z-index:2}
.selecting .tile{cursor:pointer}
.tile.sel{transform:rotate(0deg) scale(.94)}
.tile.sel .img{outline:3.5px solid var(--accent);outline-offset:3px}
.tile.dragging{opacity:.4}
.fav{position:absolute;top:10px;right:10px;height:30px;min-width:30px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:4px;color:#fff;font-size:12px;font-weight:600;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));font-variant-numeric:tabular-nums}
.fav svg{width:19px;height:19px;stroke-width:2}
.fav:hover{background:rgba(0,0,0,.25)}
.fav.mine{background:#fff;color:var(--heart);filter:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fav.mine svg{fill:currentColor}
.chk{position:absolute;top:10px;left:10px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.18);display:grid;place-items:center;opacity:0;transition:opacity .15s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.chk svg{width:14px;height:14px;stroke-width:3;color:#fff;opacity:0}
.tile:hover .chk,.selecting .chk,.tile:focus-within .chk{opacity:1}
.tile.sel .chk{background:var(--accent);border-color:var(--accent);filter:none}
.tile.sel .chk svg{opacity:1;color:var(--accent-ink)}
.dl{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#141518;opacity:0;transition:opacity .15s}
.tile:hover .dl,.tile:focus-within .dl{opacity:1}
@media (hover:none){.chk,.dl{opacity:1}}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:64px 20px;border:2px dashed var(--line);border-radius:28px;color:var(--muted);max-width:620px;margin:10px auto}
.empty h2{font-family:var(--f-disp);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);margin:0;text-wrap:balance}
.empty p{margin:0;max-width:44ch}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px}
.skel i{aspect-ratio:1/1.12;border-radius:28px;background:var(--surface);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

.fab{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 30px rgba(20,40,160,.32),0 2px 6px rgba(0,0,0,.15);z-index:15;transition:transform .2s}
.fab:hover{transform:translateX(-50%) scale(1.06)}
.fab svg{width:26px;height:26px}
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;background:var(--ink);color:var(--bg);padding:6px 6px 6px 18px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20}
.selbar b{font-variant-numeric:tabular-nums;margin-right:8px;font-weight:600}
.selbar button{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;color:var(--bg);font-weight:500}
.selbar button:hover{background:rgba(127,127,127,.28)}
.selbar .go{background:var(--accent);color:var(--accent-ink)}
.selbar .go:hover{background:var(--accent);filter:brightness(1.1)}
.selbar button[disabled]{opacity:.4;pointer-events:none}
.drop{position:absolute;inset:12px;border:2.5px dashed var(--accent);border-radius:30px;display:grid;place-items:center;z-index:30;pointer-events:none;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.drop div{background:var(--accent);color:var(--accent-ink);padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:var(--shadow)}
.uploads{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));background:var(--paper);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);z-index:40;overflow:hidden;border:1px solid var(--line)}
.uploads header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:600}
.uploads ul{list-style:none;margin:0;padding:0 0 8px;max-height:220px;overflow:auto}
.uploads li{display:flex;gap:10px;align-items:center;padding:5px 14px;font-size:12.5px}
.uploads li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uploads li em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.uploads li.err em{color:var(--heart)}
.uploads li.ok em{color:var(--accent)}

/* Lightbox (always dark, so photos read true) */
.lb{position:fixed;inset:0;background:var(--lb-bg);color:var(--lb-ink);z-index:50;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.lb-stage{position:relative;display:grid;place-items:center;padding:28px 70px;min-height:0;min-width:0}
.lb-stage img{max-width:100%;max-height:calc(100vh - 56px);object-fit:contain;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--lb-ink);background:rgba(255,255,255,.09)}
.lb-nav:hover{background:rgba(255,255,255,.18)}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-info{border-left:1px solid var(--lb-line);padding:22px;overflow:auto;display:flex;flex-direction:column;gap:18px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.lb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lb-head h3{margin:0;font-size:13px;font-weight:500;word-break:break-all;color:var(--lb-muted)}
.lb-close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--lb-ink);background:rgba(255,255,255,.09);flex:none}
.lb-prompt{font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.lb-prompt.none{color:var(--lb-muted);font-size:13px}
.params{display:flex;flex-wrap:wrap;gap:6px}
.params span{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--lb-line)}
.lb-actions{display:flex;flex-wrap:wrap;gap:8px}
.lb-actions button{height:38px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.09);color:var(--lb-ink);font-weight:500}
.lb-actions button:hover{background:rgba(255,255,255,.17)}
.lb-actions .mine{color:#FF7088}
.lb-actions .mine svg{fill:currentColor}
.lb-actions .primary{background:var(--lb-ink);color:#111}
.lb-actions .danger{color:#FF8A9A}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:13px}
dl.meta dt{color:var(--lb-muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
dl.meta dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-word}

.modal{position:fixed;inset:0;background:rgba(8,9,12,.45);display:grid;place-items:center;z-index:60;padding:16px;backdrop-filter:blur(3px)}
.dialog{background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);width:min(440px,100%);padding:24px;display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow:auto}
.dialog.wide{width:min(720px,100%)}
.dialog h4{margin:0;font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:-.02em}
.dialog p{margin:0;color:var(--muted)}
.dialog label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px}
.dialog input[type=text]{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:transparent;outline:0;font-size:15px}
.dialog input[type=text]:focus{border-color:var(--accent)}
.dialog .row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);position:relative}
.sw.on{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--accent)}
.sw.custom{display:grid;place-items:center;overflow:hidden;background:conic-gradient(from 0deg,#ff5a5a,#ffd25a,#5aff8c,#5ac8ff,#8c5aff,#ff5ad2,#ff5a5a)}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.preview-space{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line)}
.preview-space b{font-family:var(--f-disp);font-size:24px;letter-spacing:-.02em}
.contrast{font-family:var(--f-mono);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.contrast span{padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.pick{overflow:auto;border:1.5px solid var(--line);border-radius:14px;padding:6px;min-height:120px;max-height:50vh}
.pick button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;padding-left:calc(10px + var(--d) * 18px)}
.pick button:hover{background:var(--surface)}
.share-canvas{width:100%;height:auto;border-radius:16px;box-shadow:var(--shadow);display:block;aspect-ratio:1200/630;background:var(--surface)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface);border-radius:12px;padding:6px 6px 6px 12px}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12px;user-select:all}
.menu{position:fixed;z-index:70;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;min-width:180px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:10px;text-align:left}
.menu button:hover{background:var(--surface)}
.menu .danger{color:var(--heart)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);z-index:80;font-size:13px;font-weight:500;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:720px){
  .bar{grid-template-columns:auto 1fr auto}
  .mark b{display:none}
  .space{max-width:none;justify-self:center}
  .stacks{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}
  .stacks.small{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .skel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{flex:1 1 100%}.search input{width:100%}
  .acts{width:100%}
  .lb{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,58vh) auto;overflow:auto}
  .lb-stage{padding:12px 8px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .lb-stage img{max-height:calc(58vh - 24px)}
  .lb-nav{width:38px;height:38px}
  .lb-info{border-left:0;border-top:1px solid var(--lb-line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="mark"><i>C&amp;T</i><b>Stacks</b></div>
    <button class="space" id="spaceBtn" type="button"><span id="spaceName">Team space</span></button>

const S = {

/* ---------- colour + contrast ---------- */
const hexRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbHex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');

const DARK_INK = '#141518', LIGHT_INK = '#FFFFFF';

}

  }

}
const SWATCHES = ['#FFFFFF','#F2F1EC','#E9EEF6','#DDF1E4','#FFF1C9','#FFE1DA','#EADFFF','#2F5BFF','#1F3D2E','#141518'];

/* ---------- data helpers ---------- */
const kids = pid => [...S.folders.values()].filter(f => (f.parent || null) === pid)
  .sort((a, b) => (b.pinnedAt || 0) - (a.pinnedAt || 0) || (a.createdAt || 0) - (b.createdAt || 0));
const descendants = id => { const out = [id]; for (const k of kids(id)) out.push(...descendants(k.id)); return out; };
const ancestors = id => { const out = []; let f = S.folders.get(id); const seen = new Set(); while (f && !seen.has(f.id)) { seen.add(f.id); out.unshift(f); f = f.parent ? S.folders.get(f.parent) : null; } return out; };
const pathOf = (id, base) => { const a = ancestors(id); const i = base ? a.findIndex(f => f.id === base) : -1; return a.slice(i + 1).map(f => f.name.replace(/[\\/:*?"<>|]/g, '_')).join('/'); };
let likeCount = new Map(), myLikes = new Set();
function indexLikes() {
  likeCount = new Map(); myLikes = new Set();
  for (const l of S.likes) { likeCount.set(l.image, (likeCount.get(l.image) || 0) + 1); if (l.uid === S.uid) myLikes.add(l.image); }
}
const sortImgs = list => list.slice().sort((a, b) => (likeCount.get(b.id) || 0) - (likeCount.get(a.id) || 0) || (b.createdAt || 0) - (a.createdAt || 0));
const imagesIn = (id, deep) => { const set = deep ? new Set(descendants(id)) : new Set([id]); return S.images.filter(i => set.has(i.folder || null)); };
const unsorted = () => S.images.filter(i => !i.folder || !S.folders.has(i.folder));
const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1e3)) + ' KB';
const extFor = t => ({'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[t] || 'png');
const fileName = img => { let n = (img.name || 'image').replace(/[\\/:*?"<>|]/g, '_'); if (!/\.(png|jpe?g|webp|gif)$/i.test(n)) n += '.' + extFor(img.type); return n; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const rot = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0; return ((Math.abs(h) % 70) / 10 - 3.5).toFixed(1); };
function splitPrompt(p) {

/* ---------- render ---------- */
function pileHTML(imgs, small) {

function renderHome(v) {
  const roots = kids(null), un = unsorted();

  if (un.length) cards += `<div class="stack" data-drop=""><button class="pile" data-unsorted="1" data-drop-label="Drop to add here" aria-label="Open Unsorted">${pileHTML(un)}</button><div class="label"><div><b>Unsorted</b><span>${plural(un.length, 'image')}</span></div></div></div>`;

function renderStack(v, id) {

  const subs = id ? kids(id) : [];
  const liked = imgs.filter(i => likeCount.get(i.id)).length;
  v.innerHTML = `
    <button class="back" ${parent ? `data-go="${parent.id}"` : 'data-home="1"'}>${I.left}${esc(parent ? parent.name : (S.space.name || 'All stacks'))}</button>

      <div class="acts">
        ${deepTotal ? `<label class="search">${I.search}<input id="q" type="search" placeholder="Search prompts" value="${esc(S.q)}" aria-label="Search prompts"></label>` : ''}

/* ---------- navigation ---------- */

document.addEventListener('click', e => {

  if (t.dataset.new !== undefined) return newStack(t.dataset.new || null);
  if (t.dataset.share) return openShare(t.dataset.share);

/* ---------- drag & drop ----------
   files from the desktop  → onto a stack (upload there) or anywhere (current stack / Unsorted)
   an image tile           → onto a stack (move)
   a stack card            → onto the pin zone (pin) or onto another stack (nest inside) */
let dragIds = null, dragStack = null, dragDepth = 0;
const isFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
const clearDrop = () => document.querySelectorAll('.drop-on').forEach(n => n.classList.remove('drop-on'));
const endDrag = () => { dragIds = null; dragStack = null; clearDrop(); document.querySelectorAll('.lifted,.dragging').forEach(n => n.classList.remove('lifted', 'dragging')); const pz = $('pinzone'); if (pz) pz.hidden = true; };
$('view').addEventListener('dragstart', e => {
  if (!S.edit) return;
  const tile = e.target.closest('.tile');
  if (tile) {
    const id = tile.dataset.id; dragIds = S.sel.has(id) ? [...S.sel] : [id];
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', plural(dragIds.length, 'image'));
    tile.classList.add('dragging'); return;
  }
  const st = e.target.closest('.stack[data-stack]');
  if (st) {
    dragStack = st.dataset.stack;
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.folders.get(dragStack)?.name || 'stack');
    requestAnimationFrame(() => { st.classList.add('lifted'); const pz = $('pinzone'); if (pz) pz.hidden = false; });
  }
});
$('view').addEventListener('dragend', endDrag);
function targetFor(e) {
  if (dragStack) {
    const pz = e.target.closest?.('[data-pinzone]'); if (pz) return pz;
    const st = e.target.closest?.('.stack[data-stack]');
    if (st && !descendants(dragStack).includes(st.dataset.stack)) return st;
    return null;
  }
  const t = e.target.closest?.('[data-drop]');
  if (dragIds) return t && t.dataset.drop !== undefined ? t : null;
  return t;
}
document.addEventListener('dragenter', e => {
  if (!S.edit || !isFiles(e)) return;
  dragDepth++;
  if (!targetFor(e)) {
    const inStack = S.view === 'stack' || S.view === 'unsorted';
    $('dropText').textContent = inStack ? `Drop to add to ${S.view === 'stack' ? S.folders.get(S.folder)?.name : 'Unsorted'}` : 'Drop onto a stack, or here for Unsorted';
    $('drop').hidden = false;
  }
});
document.addEventListener('dragover', e => {
  if (!S.edit || !(isFiles(e) || dragIds || dragStack)) return;
  e.preventDefault();
  const t = targetFor(e);
  document.querySelectorAll('.drop-on').forEach(n => n !== t && n.classList.remove('drop-on'));
  if (t) { t.classList.add('drop-on'); $('drop').hidden = true; }
  else if (isFiles(e)) $('drop').hidden = false;
});
document.addEventListener('dragleave', e => { if (isFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; clearDrop(); } });
document.addEventListener('drop', e => {
  if (!S.edit) return;
  const t = targetFor(e);
  if (isFiles(e) || dragIds || dragStack) e.preventDefault();
  dragDepth = 0; $('drop').hidden = true;
  if (dragStack) {
    const id = dragStack; endDrag();
    if (t?.dataset.pinzone) return pinStack(id, true);
    if (t?.dataset.stack && t.dataset.stack !== id) return nestStack(id, t.dataset.stack);
    return;
  }
  if (dragIds) { const ids = dragIds; endDrag(); if (t) applyMove(ids, t.dataset.drop || null); return; }
  clearDrop();
  if (!isFiles(e)) return;
  const target = t ? (t.dataset.drop || null) : (S.view === 'stack' ? S.folder : null);
  uploadFiles(e.dataTransfer.files, target);
});

/* ---------- upload ---------- */
async function readPngText(file) {
  try {
    const b = new Uint8Array(await file.arrayBuffer());
    if (b[0] !== 0x89 || b[1] !== 0x50) return {};
    const dv = new DataView(b.buffer), out = {}, lat = new TextDecoder('latin1'), utf = new TextDecoder();
    let p = 8;
    while (p + 8 <= b.length) {
      const len = dv.getUint32(p), type = String.fromCharCode(b[p+4], b[p+5], b[p+6], b[p+7]);
      if (p + 12 + len > b.length) break;
      const d = b.subarray(p + 8, p + 8 + len);
      if (type === 'tEXt') { const z = d.indexOf(0); if (z > 0) out[lat.decode(d.subarray(0, z))] = lat.decode(d.subarray(z + 1)); }
      else if (type === 'iTXt') { const z = d.indexOf(0); if (z > 0 && d[z + 1] === 0) { const z2 = d.indexOf(0, z + 3), z3 = d.indexOf(0, z2 + 1); if (z3 > 0) out[lat.decode(d.subarray(0, z))] = utf.decode(d.subarray(z3 + 1)); } }
      if (type === 'IEND') break;
      p += 12 + len;
    }
    return out;
  } catch { return {}; }
}
async function makeThumb(file) {
  const bmp = await createImageBitmap(file);
  const w = bmp.width, h = bmp.height; let thumb = null;
  if (w > 900) {
    const tw = 800, th = Math.round(h * tw / w), c = document.createElement('canvas'); c.width = tw; c.height = th;
    c.getContext('2d').drawImage(bmp, 0, 0, tw, th);
    thumb = await new Promise(r => c.toBlob(r, 'image/webp', .82));
    if (!thumb || thumb.type !== 'image/webp') thumb = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
  }
  bmp.close?.();
  return { w, h, thumb };
}
const queue = []; let uploading = false;
function renderQueue() {
  const box = $('uploads');
  if (!queue.length) { box.hidden = true; return; }
  const done = queue.filter(q => q.state === 'ok' || q.state === 'err').length;
  box.hidden = false;
  box.innerHTML = `<header><span>Uploading ${done} of ${queue.length}</span>${done === queue.length ? `<button class="more" id="qClose" aria-label="Close">${I.x}</button>` : ''}</header>
    <ul>${queue.map(q => `<li class="${q.state === 'err' ? 'err' : q.state === 'ok' ? 'ok' : ''}"><span>${esc(q.file.name)}</span><em>${q.state === 'wait' ? 'waiting' : q.state === 'up' ? 'uploading…' : q.state === 'ok' ? 'done' : esc(q.msg)}</em></li>`).join('')}</ul>`;
  const c = $('qClose'); if (c) c.onclick = () => { queue.length = 0; renderQueue(); };
}
async function uploadFiles(list, folder) {
  if (!S.assets || !S.db) return toast('Only editors of this space can upload.');
  for (const f of [...list]) { const ok = /^image\/(png|jpeg|webp|gif)$/.test(f.type); queue.push({ file:f, folder, state: ok ? 'wait' : 'err', msg: ok ? '' : 'not an image' }); }
  renderQueue();
  if (uploading) return; uploading = true;
  for (const q of queue) {
    if (q.state !== 'wait') continue;
    q.state = 'up'; renderQueue();
    try {
      const f = q.file;
      const meta = await makeThumb(f).catch(() => ({ w:0, h:0, thumb:null }));
      const text = f.type === 'image/png' ? await readPngText(f) : {};
      const prompt = (text.Description || text.parameters || text.Comment || text.prompt || '').slice(0, 6000);
      const up = await S.assets.upload(f, { type:f.type });
      let thumb = null;
      if (meta.thumb) { try { thumb = (await S.assets.upload(meta.thumb, { type:meta.thumb.type })).id; } catch {} }
      await S.db.collection('images').add({ asset:up.id, thumb, name:f.name, type:f.type, size:up.sizeBytes, w:meta.w, h:meta.h, prompt, folder:q.folder || null, createdAt:Date.now(), by:S.uid || null });
      q.state = 'ok';
    } catch (e) { q.state = 'err'; q.msg = e?.code === 'too_large' ? 'over 20 MB' : e?.code === 'quota_or_state' ? 'storage full' : e?.code || 'failed'; }
    renderQueue();
  }
  uploading = false;
  if (queue.every(q => q.state === 'ok')) setTimeout(() => { if (!uploading && queue.every(q => q.state === 'ok')) { queue.length = 0; renderQueue(); } }, 2200);
}

/* ---------- downloads ---------- */
async function fetchBlob(id) { const r = await fetch('/_blob/' + id); if (!r.ok) throw { code:'missing' }; return r.blob(); }
const zipName = base => ((base || 'stack').replace(/[\\/:*?"<>|]/g, '_').trim() || 'stack') + '.zip';
async function downloadOne(img) {
  if (!S.dl) return toast('Downloads aren’t available in this view.');
  try { toast('Preparing download…', true); const b = await fetchBlob(img.asset); hideToast(); await S.dl.save({ filename:fileName(img), data:b }); }
  catch (e) { hideToast(); if (e?.code !== 'declined') toast(e?.code === 'missing' ? 'This file is no longer available.' : 'Download failed. Try again.'); }
}
let zipping = false;
async function downloadZip(items, name) {
  if (!S.dl) return toast('Downloads aren’t available in this view.');
  if (!window.JSZip) return toast('The ZIP tool didn’t load. Reload the page and try again.');
  if (zipping || !items.length) return; zipping = true;
  try {
    const zip = new JSZip(), used = new Set(); let done = 0, missing = 0;
    toast(`Packing 0 of ${items.length}…`, true);
    const work = items.slice();
    const worker = async () => { while (work.length) {
      const { img, path } = work.shift();
      try { const b = await fetchBlob(img.asset); let n = (path ? path + '/' : '') + fileName(img), base = n, k = 2; while (used.has(n.toLowerCase())) n = base.replace(/(\.\w+)$/, ` (${k++})$1`); used.add(n.toLowerCase()); zip.file(n, b, { binary:true }); }

  } catch (e) { hideToast(); if (e?.code !== 'declined') toast(e?.code === 'too_large' ? 'That ZIP is too large. Select fewer images.' : 'Download failed. Try again.'); }

}
function downloadStack(id) {

  const items = sortImgs(imagesIn(id, true)).map(img => ({ img, path: img.folder === id ? '' : pathOf(img.folder, id) }));
  downloadZip(items, zipName(S.folders.get(id)?.name));

  const bmps = await Promise.all(top.map(loadBmp));
  const cw = 300, ch = 375, cx = 880, cy = 325;
  const poses = [{ x:0, y:0, r:-2 }, { x:100, y:12, r:10 }, { x:-100, y:24, r:-12 }];
  for (let k = 2; k >= 0; k--) {
    const ps = poses[k], bmp = bmps[k];
    ctx.save(); ctx.translate(cx + ps.x, cy + ps.y); ctx.rotate(ps.r * Math.PI / 180);
    ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    rr(ctx, -cw / 2 - 6, -ch / 2 - 6, cw + 12, ch + 12, 36); ctx.fillStyle = p.paper; ctx.fill();
    ctx.shadowColor = 'transparent';
    rr(ctx, -cw / 2, -ch / 2, cw, ch, 30); ctx.save(); ctx.clip();
    if (bmp) { const s = Math.max(cw / bmp.width, ch / bmp.height); ctx.drawImage(bmp, -bmp.width * s / 2, -bmp.height * s / 2, bmp.width * s, bmp.height * s); }
    else { ctx.fillStyle = rgba(p.ink, .1); ctx.fillRect(-cw / 2, -ch / 2, cw, ch); }
    ctx.restore(); ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
  ctx.font = '800 21px "Bricolage Grotesque", sans-serif';
  const mw = ctx.measureText('C&T').width + 22;
  rr(ctx, 72, 66, mw, 38, 11); ctx.fillStyle = p.ink; ctx.fill();
  ctx.fillStyle = p.bg; ctx.fillText('C&T', 83, 92);
  ctx.fillStyle = p.ink; ctx.font = '700 23px "Bricolage Grotesque", sans-serif'; ctx.fillText('Stacks', 72 + mw + 11, 93);
  let size = 104; const nm = f?.name || 'Stack';
  ctx.font = `800 ${size}px "Bricolage Grotesque", sans-serif`;
  let lines = wrapText(ctx, nm, 560, 3);
  while (lines.length > 2 && size > 60) { size -= 6; ctx.font = `800 ${size}px "Bricolage Grotesque", sans-serif`; lines = wrapText(ctx, nm, 560, 3); }
  const lh = size * .98, baseY = 470 - (lines.length - 1) * lh;
  ctx.fillStyle = p.ink; lines.forEach((l, k) => ctx.fillText(l, 66, baseY + k * lh));
  ctx.font = '500 24px "Geist", sans-serif'; ctx.fillStyle = p.muted;
  ctx.fillText(`${plural(imgs.length, 'image')}${S.space.name ? '  ·  ' + S.space.name : ''}`, 72, 540);
}
async function openShare(id) {
  const f = S.folders.get(id); if (!f) return;
  const link = ARTIFACT_URL + '#g-' + id;
  dialog(`<h4>Share “${esc(f.name)}”</h4>
    <canvas class="share-canvas" id="shareCv" width="1200" height="630" aria-label="Preview card for ${esc(f.name)}"></canvas>
    <div class="linkbox"><code id="shareLink">${esc(link)}</code><button class="btn" id="copyLink">${I.copy}Copy link</button></div>
    <p>The link opens this stack for anyone the space is shared with. Download the card to post on Slack, email or social.</p>
    <div class="row"><button class="btn" data-close>Close</button>${S.dl ? `<button class="btn primary" id="dlCard">${I.dl}Download card</button>` : ''}</div>`,
    async () => {
      const cv = $('shareCv');
      $('copyLink').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch { const r = document.createRange(); r.selectNodeContents($('shareLink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl/Cmd + C to copy'); } };
      const d = $('dlCard'); if (d) d.onclick = () => cv.toBlob(async b => { try { await S.dl.save({ filename: (f.name.replace(/[\\/:*?"<>|]/g, '_') || 'stack') + ' card.png', data:b }); } catch (e) { if (e?.code !== 'declined') toast('Download failed. Try again.'); } }, 'image/png');
      await drawShare(cv, id);
    }, true);
}

/* ---------- lightbox ---------- */
let lbList = [];
function openLb(ids, idx) { lbList = ids.slice(); S.lb = idx; $('lb').hidden = false; renderLb(); }
function closeLb() { $('lb').hidden = true; $('lb').innerHTML = ''; S.lb = -1; }
function renderLb() {
  const img = S.images.find(i => i.id === lbList[S.lb]);
  if (!img) return closeLb();
  const { text, params } = splitPrompt(img.prompt), mine = myLikes.has(img.id), n = likeCount.get(img.id) || 0;
  const where = img.folder && S.folders.has(img.folder) ? ancestors(img.folder).map(f => f.name).join(' / ') : 'Unsorted';
  $('lb').innerHTML = `
    <div class="lb-stage"><img src="/_blob/${esc(img.asset)}" alt="${esc(text || img.name)}">
      ${lbList.length > 1 ? `<button class="lb-nav lb-prev" data-lb="prev" aria-label="Previous">${I.left}</button><button class="lb-nav lb-next" data-lb="next" aria-label="Next">${I.right}</button>` : ''}</div>
    <aside class="lb-info">
      <div class="lb-head"><h3>${esc(img.name)}</h3><button class="lb-close" data-lb="close" aria-label="Close">${I.x}</button></div>
      <div class="lb-prompt ${text ? '' : 'none'}">${text ? esc(text) : 'No prompt was found in this file. Midjourney PNGs carry their prompt; JPG and WebP exports usually don’t.'}</div>
      ${params.length ? `<div class="params">${params.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      <div class="lb-actions">
        ${S.dl ? `<button class="primary" data-lb="dl">${I.dl}Download</button>` : ''}
        <button data-lb="fav" class="${mine ? 'mine' : ''}">${I.heart}${mine ? 'Favourited' : 'Favourite'}${n ? ' · ' + n : ''}</button>
        ${img.prompt ? `<button data-lb="copy">${I.copy}Copy prompt</button>` : ''}
        ${S.edit ? `<button data-lb="move">${I.move}Move</button><button data-lb="del" class="danger">${I.trash}Delete</button>` : ''}
      </div>
      <dl class="meta">
        <dt>Size</dt><dd>${img.w && img.h ? `${img.w} × ${img.h} px` : '—'}</dd>
        <dt>Aspect</dt><dd>${esc(aspect(img) || '—')}</dd>
        <dt>File</dt><dd>${extFor(img.type).toUpperCase()} · ${img.size ? fmtBytes(img.size) : '—'}</dd>
        <dt>Stack</dt><dd>${esc(where)}</dd>
        <dt>Added</dt><dd>${img.createdAt ? new Date(img.createdAt).toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' }) : '—'}</dd>
        <dt>Position</dt><dd>${S.lb + 1} of ${lbList.length}</dd>
      </dl>
    </aside>`;
}
$('lb').addEventListener('click', async e => {
  const b = e.target.closest('[data-lb]');
  if (!b) { if (e.target.classList.contains('lb-stage')) closeLb(); return; }
  const img = S.images.find(i => i.id === lbList[S.lb]); if (!img) return closeLb();
  switch (b.dataset.lb) {
    case 'close': return closeLb();
    case 'prev': S.lb = (S.lb - 1 + lbList.length) % lbList.length; return renderLb();
    case 'next': S.lb = (S.lb + 1) % lbList.length; return renderLb();
    case 'dl': return downloadOne(img);
    case 'fav': return toggleLike(img.id);
    case 'copy': try { await navigator.clipboard.writeText(img.prompt); toast('Prompt copied'); } catch { const p = $('lb').querySelector('.lb-prompt'); const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press Ctrl/Cmd + C to copy'); } return;
    case 'move': { const res = await pickStack('Move image to'); if (res) applyMove([img.id], res.id); return; }
    case 'del': { if (await deleteImages([img.id])) { lbList.splice(S.lb, 1); if (!lbList.length) return closeLb(); S.lb = Math.min(S.lb, lbList.length - 1); renderLb(); } return; }
  }
});
document.addEventListener('keydown', e => {
  if (!$('modal').hidden) return;
  if (!$('lb').hidden) {
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowLeft' && lbList.length > 1) { S.lb = (S.lb - 1 + lbList.length) % lbList.length; renderLb(); }
    else if (e.key === 'ArrowRight' && lbList.length > 1) { S.lb = (S.lb + 1) % lbList.length; renderLb(); }
    else if (e.key.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey) toggleLike(lbList[S.lb]);
    return;
  }
  if (e.key === 'Escape') { if (!$('menu').hidden) $('menu').hidden = true; else if (S.selecting) { S.selecting = false; S.sel.clear(); render(); } }
});

/* ---------- boot ---------- */
try { const c = JSON.parse(lsGet('cts-space') || 'null'); if (c && typeof c === 'object') S.space = { name:String(c.name || ''), bg:String(c.bg || '') }; } catch {}
fromHash();
render();
(async () => {
  const use = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, assets, dl, user] = await Promise.all([use('db'), use('assets'), use('downloads'), use('user')]);
  S.db = db; S.assets = assets; S.dl = dl;
  S.edit = !!(assets && db);
  if (user) { try { S.uid = await user.id(); } catch {} }
  if (!db) { S.noDb = true; render(); return; }
  const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
  db.doc('settings/space').onSnapshot(s => {
    const d = s.exists ? s.data() : null;
    S.space = { name: String(d?.name || ''), bg: String(d?.bg || '') };
    lsSet('cts-space', JSON.stringify(S.space)); render();
  }, () => {});
  db.collection('folders').onSnapshot(s => { S.folders = new Map(s.docs.map(d => [d.id, { id:d.id, ...d.data() }])); render(); },
    e => { S.err = 'Stacks could not be loaded (' + (e?.code || 'error') + '). Reload to try again.'; render(); });
  db.collection('likes').limit(1000).onSnapshot(s => { S.likes = s.docs.map(d => ({ id:d.id, ...d.data() })); indexLikes(); render(); }, () => {});
  db.collection('images').orderBy('createdAt', 'desc').limit(1000).onSnapshot(s => {
    S.images = s.docs.map(d => ({ id:d.id, ...d.data() }));
    if (!s.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(timer); } else if (s.size) S.loaded = true;
    for (const id of [...S.sel]) if (!S.images.some(i => i.id === id)) S.sel.delete(id);
    render();
  }, e => { clearTimeout(timer); S.loaded = true; S.err = 'Images could not be loaded (' + (e?.code || 'error') + '). Reload to try again.'; render(); });
})();
})();
</script>
