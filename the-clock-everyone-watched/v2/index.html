<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Clock Everyone Watched, v2: the IBM clock poster keeping real time, its sixty ticks hidden until the second hand flips each one into view.">
<title>The Clock Everyone Watched</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: the poster (906×1208) is the whole page, letterboxed on its own background colour so the
     bars vanish. Three palettes, cut hard at every minute impulse. The clock is a separate layer that tilts in 3D under the pointer. */
  :root {
    --bg: #0F62FE; --title: #FFFFFF; --word: #6BE6FC; --dial: #6BE6FC; --hub: #2962F6; --logo: #FFFFFF; --note: #FFFFFF;
    --dim: 0.28;
    --fg: #FFFFFF;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
  }
  :root[data-variant="b"] { --bg: #000000; --title: #FFFFFF; --word: #2962F6; --dial: #2962F6; --hub: #0F62FE; --logo: #FFFFFF; --note: #FFFFFF; --dim: 0.3; --fg: #FFFFFF; }
  :root[data-variant="c"] { --bg: #6BE6FC; --title: #2962F6; --word: #0F62FE; --dial: #2962F6; --hub: #0F62FE; --logo: #0F62FE; --note: #2962F6; --dim: 0.3; --fg: #0F62FE; }

  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: var(--font-mono); font-size: 12px; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }

  .stage { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 var(--gutter-r) 0 var(--gutter-l); perspective: 900px; }
  .frame { position: relative; width: 906px; height: 1208px; max-width: 100%; }
  svg.poster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the clock is its own layer so it can tilt in 3D; flat drawing, slight body */
  .clockWrap { position: absolute; left: 39.527%; top: 0.896%; width: 59.603%; height: 44.702%; transform-style: preserve-3d; will-change: transform; }
  svg.clock { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* the sixty ticks are hidden slats; the second hand flips each one into view as it passes, and it tumbles away behind it */
  .ticks { position: absolute; inset: 0; pointer-events: none; perspective: 520px; transform-style: preserve-3d; }
  .tk { position: absolute; opacity: 0; transform-style: preserve-3d; will-change: transform, opacity; }
  .tk .in { position: absolute; inset: 0; }
  .tk svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  .tk .face { fill: var(--dial); }
  .tk .sh { fill: #000; opacity: 0; filter: blur(1.2px); }
  .clock .ui-hit { cursor: grab; }
  .clock .ui-hit.dragging { cursor: grabbing; }
  .poster text.note { font-family: var(--font-sans); font-size: 14.2px; fill: var(--note); }
  .poster text.note tspan.b { font-weight: 600; }

  .hud { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: var(--gutter-r); display: flex; gap: 14px; align-items: baseline; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); opacity: 0.85; pointer-events: none; font-variant-numeric: tabular-nums; }
  .hud b { font-weight: 500; }
  .hud .sep { opacity: 0.4; }
  .hint { position: fixed; top: calc(36px + env(safe-area-inset-top, 0px)); right: var(--gutter-r); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); opacity: 0.6; pointer-events: none; white-space: nowrap; }
  .keys { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: var(--gutter-l); display: flex; gap: 6px; }
  .keys button { appearance: none; border: 1px solid currentColor; background: transparent; color: var(--fg); font: inherit; font-size: 10px; letter-spacing: 0.1em; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; opacity: 0.55; transition: opacity .2s; padding: 0; }
  .keys button[aria-pressed="true"] { opacity: 1; }
  .keys button:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; opacity: 1; }
  @media (max-width: 720px) { .hud .long { display: none; } .hint { display: none; } }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var CX = 628.113, CY = 280.824;
  var SECOND_DRAWN_AT = 349.918;   // the angle the second hand was drawn at in the SVG

  var hourG = document.getElementById('hourHand');
  var minG = document.getElementById('minuteHand');
  var secG = document.getElementById('secondHand');
  var tickBySecond = [];
  Array.prototype.forEach.call(document.querySelectorAll('#ticks .tk'), function(el){
    var k = parseInt(el.getAttribute('data-s'), 10);
    var ang = parseFloat(el.getAttribute('data-a'));
    var sh = el.querySelector('.sh');
    var st = { ry: 95, sh: 0, on: false, el: el, ang: ang, shEl: sh };
    st.apply = function(){ el.style.transform = 'rotate(' + ang + 'deg) rotateY(' + st.ry.toFixed(2) + 'deg)'; sh.setAttribute('opacity', st.sh.toFixed(3)); };
    st.apply();
    tickBySecond[k] = st;
  });
  var HOLD = 3.2;   // seconds a tick stays up after the hand has passed
  function showTick(k, hold){
    var st = tickBySecond[k]; if (!st) return;
    gsap.killTweensOf(st); gsap.killTweensOf(st.el);
    st.on = true;
    var tl = gsap.timeline();
    tl.set(st.el, { opacity: 1 }, 0);
    if (reduce) { tl.set(st, { ry: 0, sh: 0.22, onUpdate: st.apply }, 0); }
    else {
      tl.fromTo(st, { ry: 95 }, { ry: 0, duration: 0.75, ease: 'back.out(1.7)', onUpdate: st.apply }, 0)
        .fromTo(st, { sh: 0 }, { sh: 0.42, duration: 0.3, ease: 'power2.out', onUpdate: st.apply }, 0)
        .to(st, { sh: 0.2, duration: 0.5, ease: 'power1.out', onUpdate: st.apply }, 0.3);
    }
    if (hold !== Infinity) {
      var h = (hold === undefined ? HOLD : hold);
      if (reduce) tl.set(st.el, { opacity: 0 }, h).set(st, { on: false }, h);
      else tl.to(st, { ry: -95, sh: 0, duration: 0.55, ease: 'power2.in', onUpdate: st.apply }, h)
             .set(st.el, { opacity: 0 }, h + 0.55).set(st, { on: false }, h + 0.55);
    }
  }
  function hideTick(k){
    var st = tickBySecond[k]; if (!st || !st.on) return;
    gsap.killTweensOf(st); gsap.killTweensOf(st.el);
    st.on = false;
    if (reduce) { gsap.set(st.el, { opacity: 0 }); return; }
    gsap.timeline().to(st, { ry: -95, sh: 0, duration: 0.4, ease: 'power2.in', onUpdate: st.apply }).set(st.el, { opacity: 0 });
  }
  var clockLabel = document.getElementById('clockLabel');
  var zoneLabel = document.getElementById('zoneLabel');
  try { zoneLabel.textContent = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').replace('_', ' ') || 'local time'; } catch (e) { zoneLabel.textContent = 'local time'; }

  // ---------- state ----------
  var A = { hour: 0, minute: 0, second: 0 };   // degrees
  var dragging = false, dragOffset = 0, dragMinutes = 0;
  var lastMinute = -1, lastSecond = -1;
  var variants = ['a', 'b', 'c'], vi = 0;
  var auto = true;

  function setVariant(i, user){
    vi = (i + 3) % 3;
    document.documentElement.setAttribute('data-variant', variants[vi]);
    document.querySelectorAll('.keys button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-v') === variants[vi] ? 'true' : 'false'); });
    if (user) auto = false;
  }
  document.querySelectorAll('.keys button').forEach(function(b){
    b.addEventListener('click', function(){ setVariant(variants.indexOf(b.getAttribute('data-v')), true); });
  });

  function apply(){
    hourG.setAttribute('transform', 'rotate(' + A.hour.toFixed(3) + ' ' + CX + ' ' + CY + ')');
    minG.setAttribute('transform', 'rotate(' + A.minute.toFixed(3) + ' ' + CX + ' ' + CY + ')');
    secG.setAttribute('transform', 'rotate(' + (A.second - SECOND_DRAWN_AT).toFixed(3) + ' ' + CX + ' ' + CY + ')');
  }
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  // ---------- the impulse: the minute hand jumps, with the little bounce of a slave clock ----------
  function impulse(h, m, first){
    var targetMin = m * 6;
    var targetHour = (h % 12) * 30 + m * 0.5;
    if (first) {
      // setting the clock: hands sweep from twelve to now
      gsap.fromTo(A, { hour: 0, minute: 0 }, { hour: targetHour, minute: targetMin, duration: reduce ? 0 : 1.8, ease: 'power3.inOut', onUpdate: apply });
      return;
    }
    // keep the tween monotonic across the top of the hour
    if (A.minute > targetMin) A.minute -= 360;
    if (A.hour > targetHour) A.hour -= 360;
    gsap.to(A, { minute: targetMin, hour: targetHour, duration: reduce ? 0 : 0.42, ease: reduce ? 'none' : 'back.out(2.4)', onUpdate: apply, overwrite: 'auto' });
  }

  function flashAll(){
    // at the impulse: a ripple runs once around the dial, then a hard cut to the next palette
    for (var k = 0; k < 60; k++) (function(k){ gsap.delayedCall(k * 0.014, function(){ showTick(k, 0.9); }); })(k);
    if (auto) setVariant(vi + 1, false);
  }

  // ---------- main loop ----------
  var first = true;
  function tick(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
    var secF = s + ms / 1000;
    if (!dragging) A.second = reduce ? s * 6 : secF * 6;

    if (m !== lastMinute) {
      if (!dragging) impulse(h, m, first);
      if (!first) flashAll();
      lastMinute = m; first = false;
    } else if (!dragging && s !== lastSecond) {
      // the hand has reached this second: flip its tick into view
      if (s !== 0) showTick(s);
    }
    if (s !== lastSecond) { clockLabel.textContent = pad(h) + ':' + pad(m) + ':' + pad(s); lastSecond = s; }
    apply();
  }
  gsap.ticker.add(tick);

  // ---------- fit the poster to the stage ----------
  var frame = document.getElementById('frame');
  function fit(){
    var stage = frame.parentElement, cs = getComputedStyle(stage);
    var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var k = Math.min(W / 906, H / 1208);
    frame.style.width = (906 * k).toFixed(2) + 'px';
    frame.style.height = (1208 * k).toFixed(2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- the clock tilts a little in 3D under the pointer; the drawing stays flat ----------
  var clockSvg = document.getElementById('clockSvg');
  var clockWrap = document.getElementById('clockWrap');
  var T = { rx: 0, ry: 0, z: 0 };
  function applyTilt(){ clockWrap.style.transform = 'translateZ(' + T.z.toFixed(1) + 'px) rotateX(' + T.rx.toFixed(2) + 'deg) rotateY(' + T.ry.toFixed(2) + 'deg)'; }
  var toRx = gsap.quickTo(T, 'rx', { duration: 0.55, ease: 'power3.out', onUpdate: applyTilt });
  var toRy = gsap.quickTo(T, 'ry', { duration: 0.55, ease: 'power3.out' });
  var toZ  = gsap.quickTo(T, 'z',  { duration: 0.55, ease: 'power3.out' });
  var MAX = reduce ? 0 : 22;
  clockSvg.addEventListener('pointermove', function(e){
    if (dragging) return;
    var r = clockWrap.getBoundingClientRect();
    var nx = (e.clientX - r.left) / r.width - 0.5, ny = (e.clientY - r.top) / r.height - 0.5;
    toRy(nx * 2 * MAX); toRx(-ny * 2 * MAX); toZ(reduce ? 0 : 70);
  });
  clockSvg.addEventListener('pointerleave', function(){ if (!dragging) { gsap.to(T, { rx: 0, ry: 0, z: 0, duration: 1.1, ease: 'elastic.out(1, 0.6)', onUpdate: applyTilt, overwrite: true }); } });

  // ---------- drag the minute hand; it always comes back ----------
  var hit = document.getElementById('dialHit');
  function angleAt(e){
    var pt = clockSvg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var p = pt.matrixTransform(clockSvg.getScreenCTM().inverse());
    return (Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI + 360) % 360;
  }
  var dragTween = null;
  hit.addEventListener('pointerdown', function(e){
    e.preventDefault();
    hit.setPointerCapture(e.pointerId);
    if (dragTween) dragTween.kill();
    gsap.killTweensOf(A);
    dragging = true; hit.classList.add('dragging');
    dragOffset = angleAt(e) - A.minute;
    dragMinutes = 0;
    gsap.to('#hint', { opacity: 0, duration: 0.4 });
  });
  hit.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var a = angleAt(e) - dragOffset;
    // unwrap so turning past twelve keeps counting
    var d = a - ((A.minute % 360) + 360) % 360;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    A.minute += d; A.hour += d / 12;
    // while dragging, the ticks read as minutes: up as far as the hand points
    var mPos = ((A.minute % 360) + 360) % 360;
    for (var k = 0; k < 60; k++) { var want = k > 0 && k * 6 <= mPos + 0.01; var st = tickBySecond[k]; if (!st) continue; if (want && !st.on) showTick(k, Infinity); else if (!want && st.on) hideTick(k); }
    apply();
  });
  function release(e){
    if (!dragging) return;
    dragging = false; hit.classList.remove('dragging');
    toRx(0); toRy(0); toZ(0);
    var now = new Date(), h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    var targetMin = m * 6, targetHour = (h % 12) * 30 + m * 0.5;
    // come back the short way, with the weight of a real mechanism
    var cur = ((A.minute % 360) + 360) % 360; var dm = targetMin - cur; if (dm > 180) dm -= 360; if (dm < -180) dm += 360;
    var curH = ((A.hour % 360) + 360) % 360; var dh = targetHour - curH; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
    A.minute = cur; A.hour = curH;
    for (var k = 0; k < 60; k++) hideTick(k);
    dragTween = gsap.to(A, { minute: cur + dm, hour: curH + dh, duration: reduce ? 0 : 1.4, ease: 'elastic.out(1, 0.45)', onUpdate: apply });
    gsap.to('#hint', { opacity: 0.6, duration: 0.6, delay: 2 });
  }
  hit.addEventListener('pointerup', release);
  hit.addEventListener('pointercancel', release);

  window.addEventListener('keydown', function(e){
    if (e.key === '1') setVariant(0, true); else if (e.key === '2') setVariant(1, true); else if (e.key === '3') setVariant(2, true);
    else if (e.key === 'a' || e.key === 'A') { auto = true; }
  });

  setVariant(0, false);
  apply();
  gsap.fromTo('.hud, .keys', { opacity: 0 }, { opacity: 1, duration: 1, delay: 0.6 });
  gsap.from('#hint', { opacity: 0, duration: 1, delay: 2.2 });
})();
</script>

</body>
</html>
