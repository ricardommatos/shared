<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Captura</title>
<link rel="stylesheet" href="capture.css">
<script src="vendor/tesseract.min.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script type="module" src="capture.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/></svg>Captura</div>
  <button class="link" type="button" id="reset">Novo livro</button>
</header>

<main class="main">
  <h1 class="hero"><span class="ink">Novo livro.</span> <span class="soft">Fotografa a capa e as páginas que queres guardar.</span></h1>

  <section class="step">
    <h2 class="label"><span class="num">1</span> Livro</h2>
    <label class="field"><span>Título</span><input id="title" list="known-books" autocomplete="off" placeholder="Grid Systems in Graphic Design"></label>
    <datalist id="known-books"></datalist>
    <label class="field"><span>Autor</span><input id="author" autocomplete="off" placeholder="Josef Müller-Brockmann"></label>
    <p class="hint" id="known-hint" hidden>Este livro já está na biblioteca. Os excertos serão acrescentados.</p>
  </section>

  <section class="step">
    <h2 class="label"><span class="num">2</span> Capa</h2>
    <div class="cover-slot" id="cover-slot">
      <img id="cover-preview" alt="Capa" hidden>
      <label class="pill primary">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span id="cover-label">Fotografar capa</span>
        <input type="file" accept="image/*" capture="environment" id="cover-input" hidden>
      </label>
    </div>
  </section>

  <section class="step">
    <h2 class="label"><span class="num">3</span> Excertos <span class="count" id="excerpt-count">0</span></h2>
    <ul class="excerpts" id="excerpts"></ul>
    <label class="pill">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Excerto</span>
      <input type="file" accept="image/*" capture="environment" id="excerpt-input" hidden>
    </label>
  </section>
</main>

<footer class="bar">
  <span class="bar-status" id="status">Guardado neste telemóvel</span>
  <button class="pill primary" type="button" id="export" disabled>Exportar .zip</button>
</footer>

<dialog class="sheet" id="editor">
  <div class="sheet-head">
    <button class="link" type="button" data-close>Cancelar</button>
    <strong id="editor-title">Recortar</strong>
    <span></span>
  </div>
  <div class="crop-step" id="crop-step">
    <p class="hint">Arrasta com o dedo sobre o texto que queres guardar.</p>
    <div class="crop-wrap"><canvas id="crop-canvas"></canvas></div>
    <div class="row">
      <button class="pill" type="button" id="use-full">Página inteira</button>
      <button class="pill primary" type="button" id="use-crop" disabled>Recortar e ler</button>
    </div>
  </div>
  <div class="text-step" id="text-step" hidden>
    <img class="crop-result" id="crop-result" alt="Recorte">
    <p class="ocr-progress" id="ocr-progress">A ler o texto…</p>
    <label class="field"><span>Texto</span><textarea id="excerpt-text" rows="8"></textarea></label>
    <div class="row two">
      <label class="field"><span>Página</span><input id="excerpt-page" inputmode="text" placeholder="42"></label>
      <label class="field"><span>Nota</span><input id="excerpt-note" placeholder="Opcional"></label>
    </div>
    <button class="pill primary wide" type="button" id="save-excerpt">Guardar excerto</button>
  </div>
</dialog>
</body>
</html>
